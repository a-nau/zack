# Prefer MIT where upstream offers a choice; keep every required AND term.
accepted = [
    "MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Zlib",
    "0BSD", "CC0-1.0", "BSL-1.0", "Unlicense", "Unicode-3.0",
    "Unicode-DFS-2016", "OFL-1.1", "Ubuntu-font-1.0",
    "MPL-2.0",
]
targets = [
    "aarch64-apple-darwin", "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu",
]
# Include build dependencies too, since some generate or compile linked code.
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
